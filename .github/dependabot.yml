version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One pull request for all action updates, majors included: they are
    # mostly runtime (Node.js) bumps of actions that work together, such as
    # cache and cache/restore (which share the VM image cache) or
    # upload-artifact and download-artifact.
    groups:
      actions:
        patterns: ["*"]
