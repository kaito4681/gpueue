name: APT repository

# Adds the .deb files of a published release to the puzuz APT repository, a
# flat repository in the release `apt` (scripts/dist/apt-repo.sh; see
# docs/install.md, "The APT repository (maintainers)").
#
# release.yml creates each release as a draft, and drafts never reach the
# repository: it runs when a person publishes the release (or a tool using a
# personal access token does). A release published with the GITHUB_TOKEN of
# a workflow does not trigger it (GitHub does not start workflows for events
# caused by GITHUB_TOKEN); run it by hand then. Pre-releases are skipped, so
# `apt upgrade` only installs stable versions.
#
# Re-run for a tag (e.g. after a failed upload): Actions > APT repository >
# Run workflow, or `gh workflow run release-apt.yml -f tag=v0.1.0`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release (tag) to add to the APT repository
        required: true

permissions:
  contents: write

# One update of the `apt` release at a time, none cancelled.
concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  apt-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      HAVE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' && secrets.APT_GPG_PASSPHRASE != '' }}
    steps:
      - name: Decide whether to publish
        id: gate
        run: |
          publish=true
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::notice::$TAG is not a version tag; nothing to publish"
            publish=false
          elif [ "$HAVE_KEY" != true ]; then
            echo "::notice::the repository secrets APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE are not set (scripts/dist/gen-apt-key.sh); skipping the APT repository"
            publish=false
          else
            state="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')"
            if [ "$state" != "false false" ]; then
              echo "::notice::$TAG is a draft or a pre-release; only published stable releases go to the APT repository"
              publish=false
            fi
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
      # The scripts of the workflow's own commit (the tag's for a release
      # event); the archive key is taken from the packages themselves.
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.publish == 'true'
        name: Install apt-ftparchive
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt-utils
      - if: steps.gate.outputs.publish == 'true'
        name: Update the APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/dist/apt-repo.sh github "$TAG"
