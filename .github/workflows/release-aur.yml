name: Release to the AUR

# Publishes packaging/aur/puzuz-bin to https://aur.archlinux.org/packages/puzuz-bin when a
# release is published (prereleases are skipped): scripts/dist/update-aur.sh sets pkgver and
# the checksums of the release's tarballs, and the PKGBUILD, .SRCINFO and install file are
# pushed to ssh://aur@aur.archlinux.org/puzuz-bin.git.
#
# One-time setup (maintainers; see docs/install.md, "The AUR package"):
# 1. Create an AUR account at https://aur.archlinux.org and add the public half of a
#    dedicated SSH key (ssh-keygen -t ed25519 -f aur_puzuz -C puzuz-aur) to it.
# 2. Store the private half as the repository secret AUR_SSH_PRIVATE_KEY:
#    gh secret set AUR_SSH_PRIVATE_KEY -R kaito4681/puzuz < aur_puzuz
# The first push creates the package on the AUR. Without the secret this workflow only
# prints a notice.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published release to package (X.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-aur
  cancel-in-progress: false

jobs:
  aur:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      HAVE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Check the secret
        id: secret
        run: |
          if [ "$HAVE_KEY" = true ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; not publishing ${VERSION} to the AUR"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.push == 'true'
      # Runs makepkg --printsrcinfo in the Arch Linux image pinned in the script.
      - name: Update the PKGBUILD and .SRCINFO
        if: steps.secret.outputs.push == 'true'
        run: scripts/dist/update-aur.sh "${VERSION#v}"
      - name: Push to the AUR
        if: steps.secret.outputs.push == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          mkdir -m 0700 "$ssh_dir"
          (umask 077; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >"$ssh_dir/key")
          # Host keys published on https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # for ed25519, SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI for ecdsa).
          cat >"$ssh_dir/known_hosts" <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          aur="$RUNNER_TEMP/aur"
          # An empty repository (before the first push) clones with a warning.
          git clone ssh://aur@aur.archlinux.org/puzuz-bin.git "$aur"
          git -C "$aur" checkout -B master
          cp packaging/aur/puzuz-bin/PKGBUILD packaging/aur/puzuz-bin/.SRCINFO \
            packaging/aur/puzuz-bin/puzuz-bin.install "$aur/"
          git -C "$aur" add PKGBUILD .SRCINFO puzuz-bin.install
          if git -C "$aur" diff --cached --quiet; then
            echo "the AUR package is already at ${VERSION}"
          else
            git -C "$aur" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update to ${VERSION#v}"
            git -C "$aur" push origin master
          fi
          rm -rf "$ssh_dir"
