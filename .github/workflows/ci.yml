name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as docker/test.Dockerfile (scripts/test-in-docker.sh).
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Keep in sync with rust-version in Cargo.toml.
      - run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          mapfile -t files < <(git ls-files '*.sh' 'packaging/scripts/*')
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 \
            -S warning "${files[@]}"

  # Advisories (RUSTSEC), crates.io as the only source and duplicate
  # versions (a warning), by a pinned, checksummed cargo-deny (deny.toml).
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          deny="$(scripts/dist/get-cargo-deny.sh "$RUNNER_TEMP/cargo-deny")"
          "$deny" --locked check advisories bans sources

  # The workflows (with shellcheck on their run: scripts), by a pinned
  # actionlint image.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # Whether this run needs the Nix jobs and the VM test below. Pull requests
  # that change only files that no flake output and no test reads (other
  # workflows, skills/, AGENTS.md, the translated READMEs, docker/, the test
  # and release scripts other than those packaging/nix/package.nix embeds)
  # skip the Nix jobs; the VM test runs for pull requests that change the
  # helper, checkpointing, the daemon, the packaging, the VM or e2e test
  # scripts, the package build scripts, Cargo.lock or this workflow. Pushes
  # and manual runs always run both. A skipped job passes a required check,
  # unlike a workflow-level paths filter, which would leave it pending.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      vm: ${{ steps.filter.outputs.vm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first
          # parent is the base branch.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          nix=true
          vm=true
          if [ "$EVENT" = pull_request ]; then
            nix=false
            vm=false
            while IFS= read -r file; do
              case "$file" in
                crates/gpueue-helper/* | crates/gpueue-checkpoint/* | crates/gpueue-daemon/* | packaging/* | \
                  scripts/vm* | scripts/dist/* | scripts/e2e/* | Cargo.lock | .github/workflows/ci.yml)
                  [ "$vm" = true ] || echo "Running the VM test, for $file"
                  vm=true ;;
              esac
              [ "$nix" = false ] || continue
              case "$file" in
                # Read by the package (keep in sync with the source fileset
                # in packaging/nix/package.nix), or this workflow.
                scripts/install.sh | scripts/dist/deb-check.sh | scripts/dist/get-minisign.sh | .github/workflows/ci.yml) ;;
                .agents/* | skills/* | AGENTS.md | README.ja.md | README.zh-CN.md | .gitignore | deny.toml | docker/* | scripts/* | .github/*)
                  continue ;;
              esac
              echo "Running the Nix jobs, for $file"
              nix=true
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"

  # flake.nix, in parallel jobs: every check, an evaluation of all outputs,
  # the whole test suite with the Nix toolchain outside the build sandbox
  # (the package build runs no tests: those that spawn jobs cannot pass in
  # the sandbox, which refuses setgid), and builds of gpueue and CRIU. The
  # x86_64 checks include two NixOS VM tests, which need KVM (the NixOS
  # module, and every gpueue-helper test), so the work there is split over
  # three runners; the aarch64 runner (no VM tests) does it all.
  nix:
    needs: [changes]
    if: needs.changes.outputs.nix == 'true'
    name: nix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The NixOS module test, and the home-manager check, which needs
          # the same gpueue build; then that package and CRIU (built for the
          # NixOS test) are tried out.
          - name: x86_64 nixos VM
            runner: ubuntu-24.04
            kvm: true
            build: .#checks.x86_64-linux.nixos .#checks.x86_64-linux.home-manager
            smoke: true
          - name: x86_64 helper-tests VM
            runner: ubuntu-24.04
            kvm: true
            build: .#checks.x86_64-linux.helper-tests
          # Evaluates every output for every system; the builds of the
          # x86_64 checks are in the two jobs above.
          - name: x86_64 eval and tests
            runner: ubuntu-24.04
            eval: true
            cargo-test: true
          - name: aarch64
            runner: ubuntu-24.04-arm
            flake-check: true
            cargo-test: true
            smoke: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # GitHub's x86_64 Linux runners have /dev/kvm, but only for root.
      - name: Enable KVM
        if: matrix.kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: ${{ matrix.kvm && 'system-features = nixos-test benchmark big-parallel kvm' || '' }}
      - if: matrix.flake-check
        run: nix flake check -L
      - if: matrix.eval
        run: nix flake check --no-build --all-systems
      - if: matrix.build
        env:
          INSTALLABLES: ${{ matrix.build }}
        run: |
          read -ra installables <<< "$INSTALLABLES"
          nix build -L --no-link "${installables[@]}"
      - name: Tests outside the build sandbox
        if: matrix.cargo-test
        run: nix develop -c cargo test --workspace --locked
      - if: matrix.smoke
        run: |
          nix build -L .#default
          ./result/bin/gpueue --version
          ./result/bin/gpueue-helper --help >/dev/null
          test -s result/share/bash-completion/completions/gpueue.bash
          nix build -L .#criu -o result-criu
          ./result-criu/bin/criu --version

  # `gpueue service install|uninstall|status` and the install method checks
  # under systemd in a privileged container.
  service-install:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/service-install-test.sh

  # Two test versions of the tree, packaged like release.yml does, for the
  # distribution tests below.
  dist-build:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/dist/build-test-versions.sh target/dist-releases test.1 test.2:migration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-releases
          path: target/dist-releases
          retention-days: 3

  # install.sh (and `gpueue update`) against a fake GitHub API, in a systemd
  # container per supported distribution (scripts/dist-test.sh).
  dist:
    runs-on: ubuntu-24.04
    needs: [dist-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04", "ubuntu:24.04", "ubuntu:22.04", "debian:12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-releases
          path: target/dist-releases
      - run: scripts/dist-test.sh
        env:
          GPUEUE_DIST_BASE: ${{ matrix.base }}
          GPUEUE_DIST_SKIP_BUILD: "1"

  # The .deb of each architecture (built like release.yml does, but from a
  # debug build), installed, reinstalled, removed and purged in plain
  # containers without systemd (scripts/deb-test.sh). On arm64 the
  # workspace tests run too, since release.yml runs them there.
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: scripts/test-in-docker.sh test --workspace --locked
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - run: scripts/dist/build-package.sh target/docker/debug target/deb
      - run: |
          for base in debian:12 ubuntu:24.04; do
            GPUEUE_DEB_BASE="$base" scripts/deb-test.sh target/deb/gpueue_*.deb
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb/gpueue_*.deb
          retention-days: 3

  # The APT repository: v1 of the .deb installed, its sources pointed at a
  # flat repository built by scripts/dist/apt-repo.sh (throwaway key), then
  # `apt-get update && apt-get upgrade` to v2, remove and purge
  # (scripts/apt-repo-test.sh).
  apt-repo:
    needs: [deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, base: "debian:12" }
          - { runner: ubuntu-24.04, base: "ubuntu:22.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:24.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:26.04" }
          - { runner: ubuntu-24.04-arm, base: "ubuntu:24.04" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb
      - run: scripts/apt-repo-test.sh target/deb/gpueue_*.deb
        env:
          GPUEUE_APT_BASES: ${{ matrix.base }}

  # The .rpm of each architecture (built like release.yml does, but from a
  # debug build), installed, upgraded from an older pre-release package and
  # removed in plain Rocky Linux 9 and Fedora containers without systemd
  # (scripts/rpm-test.sh).
  rpm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - name: Build the .rpm, and a pre-release of it to upgrade from
        run: |
          . scripts/dist/lib.sh
          version="$(workspace_version .)"
          GPUEUE_PKG_VERSION="$version-rc.1" scripts/dist/build-package.sh target/docker/debug target/rpm-old rpm
          scripts/dist/build-package.sh target/docker/debug target/rpm rpm
      - run: |
          for base in rockylinux/rockylinux:9 fedora:latest; do
            GPUEUE_RPM_BASE="$base" scripts/rpm-test.sh target/rpm-old/gpueue-*.rpm target/rpm/gpueue-*.rpm
          done
      # GPG-signing the .rpm as release.yml's sign-rpm job does.
      - run: scripts/rpm-sign-test.sh target/rpm/gpueue-*.rpm

  # The AUR package (packaging/aur/gpueue-bin) from a debug build, built with
  # makepkg, installed, upgraded and removed in an Arch Linux container with
  # systemd (scripts/dist/aur-test.sh).
  aur:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - name: Package the release tarball
        run: |
          . scripts/dist/lib.sh
          name="gpueue-v$(workspace_version .)-x86_64-unknown-linux-gnu"
          mkdir -p "target/aur/$name"
          install -m 0755 target/docker/debug/gpueue target/docker/debug/gpueue-helper "target/aur/$name/"
          cp -r README.md LICENSE docs "target/aur/$name/"
          mkdir "target/aur/$name/packaging"
          cp -r packaging/systemd packaging/sysusers.d packaging/tmpfiles.d packaging/config.toml "target/aur/$name/packaging/"
          tar -C target/aur -czf "target/aur/$name.tar.gz" "$name"
      - run: scripts/dist/aur-test.sh target/aur/gpueue-v*.tar.gz

  # Daemon + helper + CLI under systemd in a privileged container, including
  # a simulated reboot (CPU-only; the GPU scenarios need an NVIDIA GPU).
  e2e:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/e2e-test.sh
        env:
          # The FUSE part of scenario 15 must not be skipped silently.
          GPUEUE_E2E_REQUIRE_SSHFS: "1"

  # gpueue on real distributions in QEMU/KVM VMs (scripts/vm-reboot-test.sh,
  # the quick set on Ubuntu 26.04): the tree's .deb installed with apt, real
  # reboots with checkpointed, running and paused jobs, a desktop-like host
  # (systemd-resolved, a tmpfs /tmp, users' FUSE mounts), the upgrade from the
  # previous release's .deb, and `gpueue service install`. The prepared VM
  # image is cached (keyed on its provisioning, and renewed monthly).
  vm:
    needs: [changes]
    if: needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # GitHub's x86_64 Linux runners have /dev/kvm, but only for root.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vm-cache
          key: vm-images-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/vm/distros.sh', 'scripts/vm/user-data.yaml') }}
      - run: scripts/vm-reboot-test.sh quick
        env:
          GPUEUE_VM_CACHE: ${{ runner.temp }}/vm-cache
          # The releases API (the previous release for the upgrade scenario).
          GH_TOKEN: ${{ github.token }}
