name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Every other run (a push to
# main, a manual run) has a group of its own: with a shared group, GitHub
# drops a queued run when a newer one queues behind the running one, which
# left merge commits on main without any CI.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Base images of the distribution tests, pinned by digest (the multi-arch
  # index) so that a moved tag cannot break CI unrelated to a change, and
  # Docker Hub resolves them without a tag lookup. The jobs pick theirs with
  # fromJSON(env.BASE_IMAGES)[<name>]. To bump one:
  #   docker buildx imagetools inspect <name>   # the top-level "Digest:"
  # and update the value here (fedora: also move the pinned release).
  BASE_IMAGES: >-
    {
    "ubuntu:26.04": "ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944",
    "ubuntu:24.04": "ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac",
    "ubuntu:22.04": "ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956",
    "debian:12": "debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858",
    "rockylinux/rockylinux:9": "rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f",
    "fedora:44": "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80"
    }
  # Same toolchain as docker/test.Dockerfile (scripts/test-in-docker.sh).
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # The tests in the environment release.yml runs them in: root in the
  # rust:bookworm container, then an unprivileged user via runuser. No other
  # job runs there, so a failure specific to it would only show on a tag.
  release-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Keep in sync with the image of release.yml's build job.
    # CAP_SYS_PTRACE lets pidfd_getfd through Docker's default seccomp profile
    # (see scripts/test-in-docker.sh); the tests run as an unprivileged user.
    container:
      image: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
      options: --cap-add SYS_PTRACE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/dist/test-unprivileged.sh

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-version in Cargo.toml.
      - run: |
          rustup toolchain install 1.89 --profile minimal
          rustup default 1.89
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mapfile -t files < <(git ls-files '*.sh' 'packaging/scripts/*')
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 \
            -S warning "${files[@]}"

  # Advisories (RUSTSEC), crates.io as the only source and duplicate
  # versions (a warning), by a pinned, checksummed cargo-deny (deny.toml).
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          deny="$(scripts/dist/get-cargo-deny.sh "$RUNNER_TEMP/cargo-deny")"
          "$deny" --locked check advisories bans sources

  # The workflows (with shellcheck on their run: scripts), by a pinned
  # actionlint image.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # Whether this run needs the Nix jobs and the VM test below. Pull requests
  # that change only files that no flake output and no test reads (other
  # workflows, skills/, AGENTS.md, the translated READMEs, docker/, the test
  # and release scripts other than those packaging/nix/package.nix embeds)
  # skip the Nix jobs; the VM test runs for pull requests that change the
  # helper, checkpointing, the daemon, the packaging, the VM or e2e test
  # scripts, the package build scripts, Cargo.lock or this workflow. Pushes
  # and manual runs always run both. A skipped job passes a required check,
  # unlike a workflow-level paths filter, which would leave it pending.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      vm: ${{ steps.filter.outputs.vm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first
          # parent is the base branch.
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          nix=true
          vm=true
          if [ "$EVENT" = pull_request ]; then
            nix=false
            vm=false
            while IFS= read -r file; do
              case "$file" in
                crates/gpueue-helper/* | crates/gpueue-checkpoint/* | crates/gpueue-daemon/* | packaging/* | \
                  scripts/vm* | scripts/dist/* | scripts/e2e/* | Cargo.lock | .github/workflows/ci.yml)
                  [ "$vm" = true ] || echo "Running the VM test, for $file"
                  vm=true ;;
              esac
              [ "$nix" = false ] || continue
              case "$file" in
                # Read by the package (keep in sync with the source fileset
                # in packaging/nix/package.nix), or this workflow.
                scripts/install.sh | scripts/dist/deb-check.sh | scripts/dist/get-minisign.sh | \
                  scripts/nix-ci-cache.sh | .github/workflows/ci.yml) ;;
                .agents/* | skills/* | AGENTS.md | README.ja.md | README.zh-CN.md | .gitignore | deny.toml | docker/* | scripts/* | .github/*)
                  continue ;;
              esac
              echo "Running the Nix jobs, for $file"
              nix=true
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "nix=$nix" >> "$GITHUB_OUTPUT"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"

  # flake.nix, in parallel jobs: every check, an evaluation of all outputs,
  # the whole test suite with the Nix toolchain outside the build sandbox
  # (the package build runs no tests: those that spawn jobs cannot pass in
  # the sandbox, which refuses setgid), and builds of gpueue and CRIU. The
  # x86_64 checks include two NixOS VM tests, which need KVM (the NixOS
  # module, and every gpueue-helper test), so the work there is split over
  # three runners; the aarch64 runner (no VM tests) does it all.
  nix:
    needs: [changes]
    if: needs.changes.outputs.nix == 'true'
    name: nix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The NixOS module test, and the home-manager check, which needs
          # the same gpueue build; then that package and CRIU (built for the
          # NixOS test) are tried out.
          - name: x86_64 nixos VM
            runner: ubuntu-24.04
            kvm: true
            build: .#checks.x86_64-linux.nixos .#checks.x86_64-linux.home-manager
            smoke: true
            nix-cache: save
          - name: x86_64 helper-tests VM
            runner: ubuntu-24.04
            kvm: true
            build: .#checks.x86_64-linux.helper-tests
            nix-cache: restore
          # Evaluates every output for every system; the builds of the
          # x86_64 checks are in the two jobs above.
          - name: x86_64 eval and tests
            runner: ubuntu-24.04
            eval: true
            cargo-test: true
          - name: aarch64
            runner: ubuntu-24.04-arm
            flake-check: true
            cargo-test: true
            smoke: true
            nix-cache: save
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's x86_64 Linux runners have /dev/kvm, but only for root.
      - name: Enable KVM
        if: matrix.kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # What the jobs build that cache.nixos.org does not have and that does
      # not depend on gpueue's source (CRIU, the vendored crates), as a
      # binary cache of about 20 MB per architecture: restored everywhere,
      # saved only by a push to main (pull requests cannot read each other's
      # caches, and their own would only fill the 10 GB the repository has).
      # It is trusted unsigned (`trusted=1`): only main writes it.
      - id: nix-cache
        if: matrix.nix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-store-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'packaging/nix/**') }}
          restore-keys: nix-store-${{ runner.arch }}-
      # Created by this user: the root daemon would otherwise create them on
      # first use, and the save below could not empty the directory.
      - if: matrix.nix-cache
        run: mkdir -p "$RUNNER_TEMP"/nix-cache/{nar,log,realisations}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # cache.nixos.org drops connections now and then (HTTP/2 framing
          # errors, a 416 on a resumed download): fall back to building,
          # time out stalled transfers and retry them, without HTTP/2.
          extra_nix_config: |
            fallback = true
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 8
            http2 = false
            ${{ matrix.kvm && 'system-features = nixos-test benchmark big-parallel kvm' || '' }}
            ${{ matrix.nix-cache && format('extra-substituters = file://{0}/nix-cache?trusted=1&priority=30', runner.temp) || '' }}
      - if: matrix.flake-check
        run: nix flake check -L
      - if: matrix.eval
        run: nix flake check --no-build --all-systems
      - if: matrix.build
        env:
          INSTALLABLES: ${{ matrix.build }}
        run: |
          read -ra installables <<< "$INSTALLABLES"
          nix build -L --no-link "${installables[@]}"
      # The Nix toolchain's build of the dependencies (its compiler comes
      # with flake.lock).
      - if: matrix.cargo-test
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nix-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests outside the build sandbox
        if: matrix.cargo-test
        run: nix develop -c cargo test --workspace --locked
      - if: matrix.smoke
        run: |
          nix build -L .#default
          ./result/bin/gpueue --version
          ./result/bin/gpueue-helper --help >/dev/null
          test -s result/share/bash-completion/completions/gpueue.bash
          nix build -L .#criu -o result-criu
          ./result-criu/bin/criu --version
      - if: >-
          matrix.nix-cache == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.nix-cache.outputs.cache-hit != 'true'
        run: scripts/nix-ci-cache.sh "$RUNNER_TEMP/nix-cache" .#gpueue.cargoDeps .#criu
      - if: >-
          matrix.nix-cache == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: ${{ steps.nix-cache.outputs.cache-primary-key }}

  # `gpueue service install|uninstall|status` and the install method checks
  # under systemd in a privileged container.
  service-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/service-install-test.sh

  # Two test versions of the tree, packaged like release.yml does, for the
  # distribution tests below.
  dist-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/dist/build-test-versions.sh target/dist-releases test.1 test.2:migration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-releases
          path: target/dist-releases
          retention-days: 3

  # install.sh (and `gpueue update`) against a fake GitHub API, in a systemd
  # container per supported distribution (scripts/dist-test.sh).
  dist:
    runs-on: ubuntu-24.04
    needs: [dist-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04", "ubuntu:24.04", "ubuntu:22.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-releases
          path: target/dist-releases
      - run: scripts/dist-test.sh
        env:
          GPUEUE_DIST_BASE: ${{ fromJSON(env.BASE_IMAGES)[matrix.base] }}
          GPUEUE_DIST_SKIP_BUILD: "1"

  # The .deb of each architecture (built like release.yml does, but from a
  # debug build), installed, reinstalled, removed and purged in plain
  # containers without systemd (scripts/deb-test.sh). On arm64 the
  # workspace tests run too, since release.yml runs them there.
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: scripts/test-in-docker.sh test --workspace --locked
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - run: scripts/dist/build-package.sh target/docker/debug target/deb
      - run: |
          for base in "$DEBIAN_12" "$UBUNTU_2404"; do
            GPUEUE_DEB_BASE="$base" scripts/deb-test.sh target/deb/gpueue_*.deb
          done
        env:
          DEBIAN_12: ${{ fromJSON(env.BASE_IMAGES)['debian:12'] }}
          UBUNTU_2404: ${{ fromJSON(env.BASE_IMAGES)['ubuntu:24.04'] }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb/gpueue_*.deb
          retention-days: 3

  # The APT repository: v1 of the .deb installed, its sources pointed at a
  # flat repository built by scripts/dist/apt-repo.sh (throwaway key), then
  # `apt-get update && apt-get upgrade` to v2, remove and purge
  # (scripts/apt-repo-test.sh).
  apt-repo:
    needs: [deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, base: "debian:12" }
          - { runner: ubuntu-24.04, base: "ubuntu:22.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:24.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:26.04" }
          - { runner: ubuntu-24.04-arm, base: "ubuntu:24.04" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb
      - run: scripts/apt-repo-test.sh target/deb/gpueue_*.deb
        env:
          GPUEUE_APT_BASES: ${{ fromJSON(env.BASE_IMAGES)[matrix.base] }}

  # The .rpm of each architecture (built like release.yml does, but from a
  # debug build), installed, upgraded from an older pre-release package and
  # removed in plain Rocky Linux 9 and Fedora containers without systemd
  # (scripts/rpm-test.sh).
  rpm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - name: Build the .rpm, and a pre-release of it to upgrade from
        run: |
          . scripts/dist/lib.sh
          version="$(workspace_version .)"
          GPUEUE_PKG_VERSION="$version-rc.1" scripts/dist/build-package.sh target/docker/debug target/rpm-old rpm
          scripts/dist/build-package.sh target/docker/debug target/rpm rpm
      - run: |
          for base in "$ROCKY_9" "$FEDORA"; do
            GPUEUE_RPM_BASE="$base" scripts/rpm-test.sh target/rpm-old/gpueue-*.rpm target/rpm/gpueue-*.rpm
          done
        env:
          ROCKY_9: ${{ fromJSON(env.BASE_IMAGES)['rockylinux/rockylinux:9'] }}
          FEDORA: ${{ fromJSON(env.BASE_IMAGES)['fedora:44'] }}
      # GPG-signing the .rpm as release.yml's sign-rpm job does.
      - run: scripts/rpm-sign-test.sh target/rpm/gpueue-*.rpm

  # The AUR package (packaging/aur/gpueue-bin) from a debug build, built with
  # makepkg, installed, upgraded and removed in an Arch Linux container with
  # systemd (scripts/dist/aur-test.sh).
  aur:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-in-docker.sh build --locked -p gpueue -p gpueue-helper
      - name: Package the release tarball
        run: |
          . scripts/dist/lib.sh
          name="gpueue-v$(workspace_version .)-x86_64-unknown-linux-gnu"
          mkdir -p "target/aur/$name"
          install -m 0755 target/docker/debug/gpueue target/docker/debug/gpueue-helper "target/aur/$name/"
          cp -r README.md LICENSE docs "target/aur/$name/"
          mkdir "target/aur/$name/packaging"
          cp -r packaging/systemd packaging/sysusers.d packaging/tmpfiles.d packaging/config.toml "target/aur/$name/packaging/"
          tar -C target/aur -czf "target/aur/$name.tar.gz" "$name"
      - run: scripts/dist/aur-test.sh target/aur/gpueue-v*.tar.gz

  # Daemon + helper + CLI under systemd in a privileged container, including
  # a simulated reboot (CPU-only; the GPU scenarios need an NVIDIA GPU).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/e2e-test.sh
        env:
          # The FUSE part of scenario 15 must not be skipped silently.
          GPUEUE_E2E_REQUIRE_SSHFS: "1"

  # gpueue on real distributions in QEMU/KVM VMs (scripts/vm-reboot-test.sh,
  # the quick set on Ubuntu 26.04): the tree's .deb installed with apt, real
  # reboots with checkpointed, running and paused jobs, a desktop-like host
  # (systemd-resolved, a tmpfs /tmp, users' FUSE mounts), the upgrade from the
  # previous release's .deb, and `gpueue service install`. The prepared VM
  # image is cached (keyed on its provisioning, and renewed monthly).
  vm:
    needs: [changes]
    if: needs.changes.outputs.vm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's x86_64 Linux runners have /dev/kvm, but only for root.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Saved only by a push to main, like the other caches: one image per
      # pull request would fill the repository's 10 GB.
      - id: vm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vm-cache
          key: vm-images-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/vm/distros.sh', 'scripts/vm/user-data.yaml') }}
      - run: scripts/vm-reboot-test.sh quick
        env:
          GPUEUE_VM_CACHE: ${{ runner.temp }}/vm-cache
          # The releases API (the previous release for the upgrade scenario).
          GH_TOKEN: ${{ github.token }}
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.vm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vm-cache
          key: ${{ steps.vm-cache.outputs.cache-primary-key }}
