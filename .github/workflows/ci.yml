name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as docker/test.Dockerfile (scripts/test-in-docker.sh).
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-version in Cargo.toml.
      - run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mapfile -t files < <(git ls-files '*.sh' 'packaging/scripts/*')
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 \
            -S warning "${files[@]}"

  # The workflows (with shellcheck on their run: scripts), by a pinned
  # actionlint image.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # flake.nix: evaluate the outputs and run the checks (the home-manager
  # module evaluation; on x86_64 also two NixOS VM tests, which need KVM: the
  # NixOS module, and every puzuz-helper test including those the sandboxed
  # package build skips), then build puzuz (which runs the tests that work in
  # the Nix sandbox) and CRIU on both architectures.
  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # GitHub's x86_64 Linux runners have /dev/kvm, but only for root.
      - name: Enable KVM
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31.11.1
        with:
          # Only where KVM is enabled; the arm runner has no VM tests.
          extra_nix_config: ${{ matrix.runner == 'ubuntu-24.04' && 'system-features = nixos-test benchmark big-parallel kvm' || '' }}
      - run: nix flake check -L
      - run: nix build -L .#default
      - run: |
          ./result/bin/puzuz --version
          ./result/bin/puzuz-helper --help >/dev/null
          test -s result/share/bash-completion/completions/puzuz.bash
      - run: nix build -L .#criu -o result-criu
      - run: ./result-criu/bin/criu --version

  # `puzuz service install|uninstall|status` and the install method checks
  # under systemd in a privileged container.
  service-install:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/service-install-test.sh

  # Two test versions of the tree, packaged like release.yml does, for the
  # distribution tests below.
  dist-build:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dist/build-test-versions.sh target/dist-releases test.1 test.2:migration
      - uses: actions/upload-artifact@v4
        with:
          name: dist-releases
          path: target/dist-releases
          retention-days: 3

  # install.sh (and `puzuz update`) against a fake GitHub API, in a systemd
  # container per supported distribution (scripts/dist-test.sh).
  dist:
    runs-on: ubuntu-24.04
    needs: [dist-build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:26.04", "ubuntu:24.04", "ubuntu:22.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-releases
          path: target/dist-releases
      - run: scripts/dist-test.sh
        env:
          PUZUZ_DIST_BASE: ${{ matrix.base }}
          PUZUZ_DIST_SKIP_BUILD: "1"

  # The .deb of each architecture (built like release.yml does, but from a
  # debug build), installed, reinstalled, removed and purged in plain
  # containers without systemd (scripts/deb-test.sh). On arm64 the
  # workspace tests run too, since release.yml runs them there.
  deb:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: scripts/test-in-docker.sh test --workspace --locked
      - run: scripts/test-in-docker.sh build --locked -p puzuz -p puzuz-helper
      - run: scripts/dist/build-package.sh target/docker/debug target/deb
      - run: |
          for base in debian:12 ubuntu:24.04; do
            PUZUZ_DEB_BASE="$base" scripts/deb-test.sh target/deb/puzuz_*.deb
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb/puzuz_*.deb
          retention-days: 3

  # The APT repository: v1 of the .deb installed, its sources pointed at a
  # flat repository built by scripts/dist/apt-repo.sh (throwaway key), then
  # `apt-get update && apt-get upgrade` to v2, remove and purge
  # (scripts/apt-repo-test.sh).
  apt-repo:
    needs: [deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, base: "debian:12" }
          - { runner: ubuntu-24.04, base: "ubuntu:22.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:24.04" }
          - { runner: ubuntu-24.04, base: "ubuntu:26.04" }
          - { runner: ubuntu-24.04-arm, base: "ubuntu:24.04" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: target/deb
      - run: scripts/apt-repo-test.sh target/deb/puzuz_*.deb
        env:
          PUZUZ_APT_BASES: ${{ matrix.base }}

  # The .rpm of each architecture (built like release.yml does, but from a
  # debug build), installed, upgraded from an older pre-release package and
  # removed in plain Rocky Linux 9 and Fedora containers without systemd
  # (scripts/rpm-test.sh).
  rpm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-in-docker.sh build --locked -p puzuz -p puzuz-helper
      - name: Build the .rpm, and a pre-release of it to upgrade from
        run: |
          . scripts/dist/lib.sh
          version="$(workspace_version .)"
          PUZUZ_PKG_VERSION="$version-rc.1" scripts/dist/build-package.sh target/docker/debug target/rpm-old rpm
          scripts/dist/build-package.sh target/docker/debug target/rpm rpm
      - run: |
          for base in rockylinux/rockylinux:9 fedora:latest; do
            PUZUZ_RPM_BASE="$base" scripts/rpm-test.sh target/rpm-old/puzuz-*.rpm target/rpm/puzuz-*.rpm
          done
      # GPG-signing the .rpm as release.yml's sign-rpm job does.
      - run: scripts/rpm-sign-test.sh target/rpm/puzuz-*.rpm

  # The AUR package (packaging/aur/puzuz-bin) from a debug build, built with
  # makepkg, installed, upgraded and removed in an Arch Linux container with
  # systemd (scripts/dist/aur-test.sh).
  aur:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-in-docker.sh build --locked -p puzuz -p puzuz-helper
      - name: Package the release tarball
        run: |
          . scripts/dist/lib.sh
          name="puzuz-v$(workspace_version .)-x86_64-unknown-linux-gnu"
          mkdir -p "target/aur/$name"
          install -m 0755 target/docker/debug/puzuz target/docker/debug/puzuz-helper "target/aur/$name/"
          cp -r README.md LICENSE docs "target/aur/$name/"
          tar -C target/aur -czf "target/aur/$name.tar.gz" "$name"
      - run: scripts/dist/aur-test.sh target/aur/puzuz-v*.tar.gz

  # Daemon + helper + CLI under systemd in a privileged container, including
  # a simulated reboot (CPU-only; the GPU scenarios need an NVIDIA GPU).
  e2e:
    runs-on: ubuntu-24.04
    needs: [test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/e2e-test.sh
        env:
          # The FUSE part of scenario 15 must not be skipped silently.
          PUZUZ_E2E_REQUIRE_SSHFS: "1"
