name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Build on Debian bookworm, as scripts/test-in-docker.sh does, so the
    # binaries need only glibc 2.36 (see docs/install.md).
    container: rust:1.98.1-bookworm
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG != v$version"; exit 1; }
      - run: cargo build --release --locked -p puzuz -p puzuz-helper
      - name: Package
        run: |
          name="puzuz-$TAG-$TARGET"
          mkdir -p "dist/$name"
          install -m 0755 target/release/puzuz target/release/puzuz-helper "dist/$name/"
          cp -r README.md LICENSE docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz*

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update the GitHub release
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --draft -R "$GITHUB_REPOSITORY"
          fi
