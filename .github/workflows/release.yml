name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

jobs:
  # Fails fast, before the build, when releases cannot be signed: the
  # committed public key is the test key, install.sh embeds another key, or
  # the secrets are missing (see scripts/dist/gen-signing-key.sh); or when
  # the .deb would ship the test APT archive key (scripts/dist/gen-apt-key.sh).
  check-signing:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAVE_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
      HAVE_PASSWORD: ${{ secrets.MINISIGN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Check the signing key and secrets
        run: |
          # DB9113B27575DD08 is the test key; its secret key was never kept.
          if grep -q -e 'TEST KEY' -e 'DB9113B27575DD08' packaging/minisign.pub; then
            echo "::error::packaging/minisign.pub is the test key; create the release key with scripts/dist/gen-signing-key.sh"
            exit 1
          fi
          key="$(sed -n 2p packaging/minisign.pub)"
          if ! grep -qxF "MINISIGN_PUBKEY=\"$key\"" scripts/install.sh; then
            echo "::error::MINISIGN_PUBKEY in scripts/install.sh differs from packaging/minisign.pub"
            exit 1
          fi
          if [ "$HAVE_SECRET_KEY" != true ] || [ "$HAVE_PASSWORD" != true ]; then
            echo "::error::the repository secrets MINISIGN_SECRET_KEY and MINISIGN_PASSWORD must be set (scripts/dist/gen-signing-key.sh prints the commands)"
            exit 1
          fi
          if grep -aq 'TEST KEY' packaging/apt/puzuz-archive-keyring.gpg; then
            echo "::error::packaging/apt/puzuz-archive-keyring.gpg is the test key; create the APT archive key with scripts/dist/gen-apt-key.sh"
            exit 1
          fi

  # Native builds per architecture (the helper embeds C code, so no cross
  # compiling): the tarball, the .deb and the .rpm, with their checksums.
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Build on Debian bookworm, as scripts/test-in-docker.sh does, so the
    # binaries need only glibc 2.34 (see docs/install.md). The image is
    # multi-arch, so the arm64 runner gets the arm64 toolchain.
    container: rust:1.98.1-bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG != v$version"; exit 1; }
      - name: Check the runner's architecture matches the target
        run: '[ "$(uname -m)" = "${TARGET%%-*}" ] || { echo "$(uname -m) cannot build $TARGET natively"; exit 1; }'
      # The job runs as root in the container; the helper's tests refuse
      # root, so they run as an unprivileged user.
      - name: Test
        run: |
          useradd -m builder
          chown -R builder: .
          runuser -u builder -- env PATH="$PATH" RUSTUP_HOME="$RUSTUP_HOME" \
            CARGO_HOME=/home/builder/.cargo CARGO_TARGET_DIR=/home/builder/target \
            cargo test --workspace --locked
      - run: cargo build --release --locked -p puzuz -p puzuz-helper
      - name: Package
        run: |
          name="puzuz-$TAG-$TARGET"
          mkdir -p "dist/$name"
          install -m 0755 target/release/puzuz target/release/puzuz-helper "dist/$name/"
          cp -r README.md LICENSE docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" >"$name.tar.gz.sha256")
      # dist/puzuz_<version>_<amd64|arm64>.deb (packaging/nfpm.yaml).
      - name: Build the .deb
        run: |
          deb="$(scripts/dist/build-package.sh target/release dist deb)"
          (cd dist && sha256sum "$(basename "$deb")" >"$(basename "$deb").sha256")
      # dist/puzuz-<version>-1.<x86_64|aarch64>.rpm (packaging/nfpm.yaml),
      # unsigned: the sign-rpm job GPG-signs it, so that the signing key
      # never enters this job, where the dependencies' build scripts ran as
      # root.
      - name: Build the .rpm
        run: scripts/dist/build-package.sh target/release dist rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
            dist/*.rpm*

  # GPG-signs the .rpm files (rpm -K) with the APT repository's key, on a
  # fresh runner that never ran the build (scripts/dist/sign-rpm.sh); the
  # release job attaches the key's public half as RPM-GPG-KEY-puzuz. Without
  # the key (or with the test key) they stay unsigned and, like every asset,
  # are covered by their .minisig and .sha256.
  sign-rpm:
    needs: [check-signing, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign the .rpm files
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          RPM_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          keyring=packaging/apt/puzuz-archive-keyring.gpg
          if [ -n "$APT_GPG_PRIVATE_KEY" ] && ! grep -aq 'TEST KEY' "$keyring"; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends rpm
            key="$RUNNER_TEMP/rpm-signing.asc"
            (umask 077; printf '%s\n' "$APT_GPG_PRIVATE_KEY" >"$key")
            scripts/dist/sign-rpm.sh "$key" "$keyring" dist/*.rpm
            rm -f "$key"
          else
            echo "::warning::APT_GPG_PRIVATE_KEY is not set (or the APT key is the test key); the .rpm files are not GPG-signed"
          fi
          # Signed or not, every .rpm gets its .sha256 (of the final file).
          for rpm in dist/*.rpm; do
            (cd dist && sha256sum "$(basename "$rpm")" >"$(basename "$rpm").sha256")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-signed
          path: dist/*.rpm*

  release:
    needs: [check-signing, build, sign-rpm]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # The .rpm files of the sign-rpm job replace the unsigned ones.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rpm-signed
          path: rpm-signed
      - run: cp -f rpm-signed/* dist/
      # The public key the .rpm files are signed with, ASCII-armored as
      # `rpm --import` needs it (the same key as the APT repository's), and
      # signed with minisign below like every other asset.
      - name: Attach the .rpm signing key
        env:
          HAVE_RPM_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
        run: |
          keyring=packaging/apt/puzuz-archive-keyring.gpg
          if [ "$HAVE_RPM_KEY" = true ] && ! grep -aq 'TEST KEY' "$keyring"; then
            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            gpg --batch --quiet --import "$keyring"
            gpg --batch --armor --export >dist/RPM-GPG-KEY-puzuz
          fi
      # dist/<name>.{tar.gz,deb,rpm}.minisig, install.sh with its
      # install.sh.minisig and RPM-GPG-KEY-puzuz (when attached) with its
      # RPM-GPG-KEY-puzuz.minisig, checked against packaging/minisign.pub
      # (the key built into `puzuz`).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::MINISIGN_SECRET_KEY and MINISIGN_PASSWORD are not set"
            exit 1
          fi
          minisign="$(scripts/dist/get-minisign.sh "$RUNNER_TEMP/minisign")"
          key="$RUNNER_TEMP/minisign.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key")
          install -m 0644 scripts/install.sh dist/install.sh
          files=(dist/*.tar.gz dist/*.deb dist/*.rpm dist/install.sh)
          [ ! -f dist/RPM-GPG-KEY-puzuz ] || files+=(dist/RPM-GPG-KEY-puzuz)
          for file in "${files[@]}"; do
            printf '%s\n' "$MINISIGN_PASSWORD" |
              "$minisign" -S -s "$key" -m "$file" -t "puzuz $TAG $(basename "$file")"
            "$minisign" -V -p packaging/minisign.pub -m "$file"
          done
          rm -f "$key"
      - name: Write the release notes
        run: |
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          ## Install or update (administrators)

          With install.sh (x86_64 and aarch64; later updates with \`sudo puzuz update\`):

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sudo bash -s -- --version ${TAG#v}
          \`\`\`

          On Debian and Ubuntu, the package instead (download the file for your architecture):

          \`\`\`sh
          sudo apt install ./puzuz_${TAG#v}_amd64.deb    # x86_64
          sudo apt install ./puzuz_${TAG#v}_arm64.deb    # aarch64
          \`\`\`

          On Fedora, RHEL, Rocky and Alma Linux, the .rpm (there is no dnf repository yet:
          update an older .rpm installation with \`sudo dnf upgrade\` and the same URL):

          \`\`\`sh
          sudo dnf install https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/puzuz-${TAG#v}-1.x86_64.rpm    # x86_64
          sudo dnf install https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/puzuz-${TAG#v}-1.aarch64.rpm   # aarch64
          \`\`\`

          Running jobs keep running. The tarballs (\`puzuz-$TAG-<target>.tar.gz\`), the
          \`.deb\` and the \`.rpm\` files and \`install.sh\` are signed with minisign
          (\`.minisig\`, public key in \`packaging/minisign.pub\`); see docs/install.md for
          checking \`install.sh\` before running it, manual installation and uninstalling.
          EOF
      - name: Create or update the GitHub release
        run: |
          if draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            # Replacing the assets of a published release would change what
            # users already downloaded.
            if [ "$draft" != true ]; then
              echo "release $TAG is already published; refusing to replace its assets"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
              --draft -R "$GITHUB_REPOSITORY"
          fi
