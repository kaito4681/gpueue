# /etc/puzuz/config.toml of the e2e test with PUZUZ_E2E_GPU=1: GPU 0 is
# the real GPU passed with `docker run --gpus all`; GPU 1 is fake (only
# used by CPU-only jobs that get CUDA_VISIBLE_DEVICES). Scenario 12 replaces
# it for a while with gpu_detection = "auto" and no [[gpus]] (NVML).
grace_secs = 5
gpu_detection = "static"

[[gpus]]
index = 0
uuid = "GPU-real-0"
name = "GPU 0"

[[gpus]]
index = 1
uuid = "GPU-fake-1"
name = "Fake GPU 1"

# Recalculate fair-share usage every second (scenario 17).
[priority]
priority_calc_period_secs = 1
