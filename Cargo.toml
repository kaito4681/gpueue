[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/gpueue"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kaito4681/gpueue"

[workspace.dependencies]
gpueue-core = { path = "crates/gpueue-core" }
gpueue-protocol = { path = "crates/gpueue-protocol" }
gpueue-daemon = { path = "crates/gpueue-daemon" }
gpueue-checkpoint = { path = "crates/gpueue-checkpoint" }
gpueue-config = { path = "crates/gpueue-config" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
chrono = "0.4"
interim = { version = "0.2", features = ["chrono_0_4"] }
# `fallible_uint` keeps the checked u64/usize conversions that rusqlite
# provided by default before 0.38 (ids and sizes are stored as u64).
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
# Async stack: no features here; each crate enables exactly what it uses so the
# root helper does not inherit the daemon's or the CLI's needs.
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
tower-service = "0.3"
comfy-table = "8"
nix = { version = "0.31", features = ["user", "sched", "mount", "signal", "process", "fs", "ptrace"] }
axum = "0.8"
futures = "0.3"
tokio-util = "0.7"
# Only `from_str` is used (gpueue-config); a crate that serializes adds "display".
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
nvml-wrapper = "0.13"
cc = "1"
# `gpueue update` only (never the helper): HTTPS with rustls, release
# signatures, checksums and tarballs.
ureq = { version = "3", default-features = false, features = ["rustls"] }
minisign-verify = "0.3"
sha2 = "0.11"
semver = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
