[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/puzuz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kaito4681/puzuz"

[workspace.dependencies]
puzuz-core = { path = "crates/puzuz-core" }
puzuz-protocol = { path = "crates/puzuz-protocol" }
puzuz-daemon = { path = "crates/puzuz-daemon" }
puzuz-checkpoint = { path = "crates/puzuz-checkpoint" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
chrono = "0.4"
interim = { version = "0.2", features = ["chrono_0_4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
nix = { version = "0.30", features = ["sched", "mount", "user", "signal", "process", "fs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
