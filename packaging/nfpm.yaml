# nfpm definition of the puzuz package (https://nfpm.goreleaser.com).
#
# Built by scripts/dist/build-package.sh, which lays out a staging directory
# (bin/, completions/ and copies of packaging/, docs/, README.md and LICENSE)
# and runs nfpm in it, so every `src:` below is relative to that directory.
# It sets PUZUZ_PKG_ARCH (nfpm's GOARCH-style name: amd64 or arm64; nfpm
# writes x86_64 / aarch64 into an .rpm) and PUZUZ_PKG_VERSION (the workspace
# version; a pre-release such as 0.2.0-rc.1 becomes 0.2.0~rc.1 inside both
# the .deb and the .rpm, so that it sorts before 0.2.0).
#
# Shared by the .deb and the .rpm. Bits that only make sense for one format
# are marked `packager: deb` / `packager: rpm` (contents) or live under
# `overrides.<format>` / the `rpm:` section.
name: puzuz
arch: ${PUZUZ_PKG_ARCH}
platform: linux
version: ${PUZUZ_PKG_VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: kaito4681 <kaito4681@users.noreply.github.com>
vendor: kaito4681
homepage: https://github.com/kaito4681/puzuz
license: MIT
description: |-
  Multi-user GPU job queue with checkpoint/restore
  puzuz is a pueue-compatible job queue for shared GPU machines. Jobs are
  checkpointed with CRIU and cuda-checkpoint and restored after a reboot.
  It runs as two systemd services: an unprivileged daemon (puzuz.service)
  and a root helper (puzuz-helper.service) that starts jobs as their owners.

contents:
  # Binaries.
  - src: bin/puzuz
    dst: /usr/bin/puzuz
    file_info: { mode: 0755 }
  - src: bin/puzuz-helper
    dst: /usr/bin/puzuz-helper
    file_info: { mode: 0755 }

  # systemd units, users and directories. The unit templates already run
  # /usr/bin/...; `puzuz service install` rewrites ExecStart= and adds its
  # marker line, a package ships them unchanged (no marker), which is how the
  # install method tells the two apart.
  - src: packaging/systemd/puzuz.service
    dst: /usr/lib/systemd/system/puzuz.service
    file_info: { mode: 0644 }
  - src: packaging/systemd/puzuz-helper.service
    dst: /usr/lib/systemd/system/puzuz-helper.service
    file_info: { mode: 0644 }
  - src: packaging/sysusers.d/puzuz.conf
    dst: /usr/lib/sysusers.d/puzuz.conf
    file_info: { mode: 0644 }
  - src: packaging/tmpfiles.d/puzuz.conf
    dst: /usr/lib/tmpfiles.d/puzuz.conf
    file_info: { mode: 0644 }

  # Configuration (kept on upgrades when edited, removed on purge).
  - dst: /etc/puzuz
    type: dir
    file_info: { mode: 0755 }
  - src: packaging/config.toml
    dst: /etc/puzuz/config.toml
    type: config|noreplace
    file_info: { mode: 0644 }

  # Shell completions, generated by `puzuz completions <shell>`.
  - src: completions/puzuz.bash
    dst: /usr/share/bash-completion/completions/puzuz
    file_info: { mode: 0644 }
  - src: completions/puzuz.fish
    dst: /usr/share/fish/vendor_completions.d/puzuz.fish
    file_info: { mode: 0644 }
  - src: completions/_puzuz
    dst: /usr/share/zsh/vendor-completions/_puzuz
    packager: deb
    file_info: { mode: 0644 }
  - src: completions/_puzuz
    dst: /usr/share/zsh/site-functions/_puzuz
    packager: rpm
    file_info: { mode: 0644 }

  # Documentation.
  - src: README.md
    dst: /usr/share/doc/puzuz/README.md
    file_info: { mode: 0644 }
  - src: docs/install.md
    dst: /usr/share/doc/puzuz/install.md
    file_info: { mode: 0644 }
  - src: docs/architecture.md
    dst: /usr/share/doc/puzuz/architecture.md
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/puzuz/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/puzuz/LICENSE
    type: license
    packager: rpm
    file_info: { mode: 0644 }

  # The APT repository (a flat repository in the GitHub release "apt") and
  # the key its index is signed with, so that installing one .deb by hand is
  # enough to get later versions from `apt upgrade`. Both are conffiles:
  # `apt remove` keeps them together (the source keeps working), purge
  # deletes both, and an unmodified keyring is replaced on upgrade (how a
  # new key is rolled out). The .rpm ships no .repo file (and no key) until
  # a dnf repository exists (issue #23): with dnf's default
  # skip_if_unavailable=False, a configured repository that cannot be
  # fetched makes every dnf command fail.
  - src: packaging/apt/puzuz.sources
    dst: /etc/apt/sources.list.d/puzuz.sources
    type: config|noreplace
    packager: deb
    file_info: { mode: 0644 }
  - src: packaging/apt/puzuz-archive-keyring.gpg
    dst: /etc/apt/keyrings/puzuz.gpg
    type: config
    packager: deb
    file_info: { mode: 0644 }

# POSIX sh, written for both the deb and the rpm argument conventions.
scripts:
  preinstall: packaging/scripts/preinst
  postinstall: packaging/scripts/postinst
  preremove: packaging/scripts/prerm
  postremove: packaging/scripts/postrm

# Only what puzuz cannot run without. CRIU is recommended, not required: the
# distributions' CRIU is often older than the 4.2 puzuz needs (or missing),
# jobs run without it, and `puzuz doctor` reports a missing or old CRIU.
# Nothing GPU-specific: the NVIDIA driver and cuda-checkpoint come from
# NVIDIA.
overrides:
  deb:
    depends:
      # nfpm does not compute shlibs. The binaries link libc, libm and
      # libgcc_s, with symbols up to GLIBC_2.34 (the release build's
      # baseline); NVML is loaded at run time, when present.
      - libc6 (>= 2.34)
      - libgcc-s1
      - systemd (>= 240)
    recommends:
      - criu
  rpm:
    depends:
      # nfpm does not generate rpm's automatic library dependencies either:
      # the same baseline as the .deb (libgcc_s.so.1 is in libgcc).
      - glibc >= 2.34
      - libgcc
      - systemd
    # A weak dependency (dnf installs it by default when available). Rocky 9
    # ships CRIU 3.19, older than what checkpointing needs; doctor says so.
    recommends:
      - criu

rpm:
  group: System Environment/Daemons
  summary: Multi-user GPU job queue with checkpoint/restore
  # Optional signature of the .rpm itself (rpm -K): build-package.sh sets
  # PUZUZ_RPM_SIGNING_KEY to an ASCII-armored GPG secret key file (and
  # NFPM_RPM_PASSPHRASE to its passphrase) when one is available; empty
  # means unsigned. Every release asset is signed with minisign anyway.
  signature:
    key_file: ${PUZUZ_RPM_SIGNING_KEY}
