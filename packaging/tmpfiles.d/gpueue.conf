# Directories of gpueue. The helper runs as root and refuses to start unless
# its state, checkpoint and log bases (and all their parents) are owned by
# root and not group/world-writable, so the daemon gets its own
# subdirectory for state.sqlite (the daemon's default `state_db` is
# /var/lib/gpueue/daemon/state.sqlite).
#
# Type Path                              Mode User  Group Age
d      /var/lib/gpueue                    0755 root  root  -
d      /var/lib/gpueue/daemon             0700 gpueue gpueue -
d      /var/lib/gpueue/helper             0711 root  root  -
d      /var/lib/gpueue/checkpoints        0700 root  root  -
# Per-user subdirectories (<uid>, mode 2770, owner the user, group gpueue)
# are created by the helper.
d      /var/lib/gpueue/logs               0755 root  root  -
# The fork guard preloaded into jobs; the helper installs it here.
d      /var/lib/gpueue/lib                0755 root  root  -
# Empty CRIU plugin directory for the manual CUDA mode.
d      /var/lib/gpueue/criu-no-plugins    0755 root  root  -
# Sockets: gpueue.sock (daemon, mode 0666) and helper.sock (helper, owned by
# gpueue, mode 0600).
d      /run/gpueue                        0755 gpueue gpueue -
# Root-only: the bind mount of / used by `criu restore --root`.
d      /run/gpueue-helper                 0700 root  root  -
