# Directories of puzuz. The helper runs as root and refuses to start unless
# its state, checkpoint and log bases (and all their parents) are owned by
# root and not group/world-writable, so the daemon gets its own
# subdirectory for state.sqlite (the daemon's default `state_db` is
# /var/lib/puzuz/daemon/state.sqlite).
#
# Type Path                              Mode User  Group Age
d      /var/lib/puzuz                    0755 root  root  -
d      /var/lib/puzuz/daemon             0700 puzuz puzuz -
d      /var/lib/puzuz/helper             0711 root  root  -
d      /var/lib/puzuz/checkpoints        0700 root  root  -
# Per-user subdirectories (<uid>, mode 2770, owner the user, group puzuz)
# are created by the helper.
d      /var/lib/puzuz/logs               0755 root  root  -
# Empty CRIU plugin directory for the manual CUDA mode.
d      /var/lib/puzuz/criu-no-plugins    0755 root  root  -
# Sockets: puzuz.sock (daemon, mode 0666) and helper.sock (helper, owned by
# puzuz, mode 0600).
d      /run/puzuz                        0755 puzuz puzuz -
# Root-only: the bind mount of / used by `criu restore --root`.
d      /run/puzuz-helper                 0700 root  root  -
