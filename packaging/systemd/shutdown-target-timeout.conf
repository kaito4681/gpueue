# Drop-in installed as gpueue.conf into reboot.target.d, poweroff.target.d,
# halt.target.d, kexec.target.d and soft-reboot.target.d.
#
# systemd ships these targets with JobTimeoutSec=30min and
# JobTimeoutAction=<reboot|poweroff|...>-force. The timeout runs from the
# moment the shutdown is queued, and when it passes the machine is forced
# down at once, also in the middle of the helper's `criu dump`: the job loses
# its checkpoint. TimeoutStopSec= of gpueue-helper.service and the helper's
# EXTEND_TIMEOUT_USEC requests cannot extend it, so this caps the time the
# whole shutdown (dumping every job included) may take.
#
# 2 h fits about 200 GiB of RSS + VRAM in total at the checkpoint deadline's
# rate (30 s/GiB) and several TiB at the speed of an NVMe disk (~2.5 s/GiB).
# Keep it above gpueue-helper.service's TimeoutStopSec= (30 min by default)
# plus the time the other services take to stop. To change it, add a drop-in
# that sorts after this one for each target, e.g. with
# `sudo systemctl edit reboot.target` (see docs/install.md, "Shutdown
# timeouts").
[Unit]
JobTimeoutSec=2h
