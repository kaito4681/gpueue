# Configuration of puzuz: read by the daemon (puzuz.service) and by the root
# helper (puzuz-helper.service). Keys marked [helper] are used by the helper,
# [both] by both; unmarked keys are the daemon's.
#
# Created by `puzuz service install`, which never overwrites this file.
# Every key is optional; the commented values are the defaults. Unknown keys
# are ignored. Restart what uses a changed key:
# `sudo systemctl restart puzuz-helper.service puzuz.service`.
# (Restarting the helper leaves running jobs alone.)
#
# The helper runs as root and refuses to start unless this file and
# /etc/puzuz are owned by root and not group/world-writable. Flags on the
# helper's ExecStart= (see `puzuz-helper serve --help`) override this file.
# Groups and GPU slot limits are not configured here; they are stored in the
# daemon's database and changed with `puzuz group` and `puzuz gpu parallel`.

# [both] Base directory of the state database (daemon/state.sqlite), the
# helper's state (helper/), job logs (logs/) and checkpoint images
# (checkpoints/). Keep the layout created by /etc/tmpfiles.d/puzuz.conf: the
# helper requires the base directory to be owned by root.
# data_dir = "/var/lib/puzuz"

# Override single locations below data_dir. helper_state_dir [helper],
# logs_dir and checkpoints_dir [both] must be owned by root.
# state_db = "/var/lib/puzuz/daemon/state.sqlite"
# helper_state_dir = "/var/lib/puzuz/helper"
# logs_dir = "/var/lib/puzuz/logs"
# checkpoints_dir = "/var/lib/puzuz/checkpoints"

# The socket clients connect to (callers are identified by SO_PEERCRED).
# api_socket = "/run/puzuz/puzuz.sock"

# [both] The root helper's socket.
# helper_socket = "/run/puzuz/helper.sock"

# [helper] The system user the daemon runs as (User= of puzuz.service); the
# helper accepts connections only from it.
# daemon_user = "puzuz"

# [both] Seconds between SIGTERM and SIGKILL when stopping a job.
# grace_secs = 30

# Command prefix a job's command line is appended to.
# shell = ["sh", "-c"]

# Warn when all checkpoint images together exceed this many bytes.
# checkpoint_size_limit_bytes = 500_000_000_000

# [both] Close TCP connections when checkpointing (`criu --tcp-close`).
# checkpoint_tcp_close = true

# [helper] Paths of criu, cuda-checkpoint and nvidia-smi (names are looked up
# in PATH; absolute paths must be owned by root).
# criu_path = "criu"
# cuda_checkpoint_path = "cuda-checkpoint"
# nvidia_smi_path = "nvidia-smi"

# [helper] "manual": the helper calls cuda-checkpoint around criu (works with
# the distribution's criu). "plugin": CRIU's CUDA plugin does it.
# cuda_checkpoint_mode = "manual"

# [helper] Seconds `criu dump` / `criu restore` may take before they are killed.
# criu_dump_timeout_secs = 1800
# criu_restore_timeout_secs = 1800

# [helper] Preload the fork guard (<data_dir>/lib/puzuz-forkguard-*.so) into
# jobs. Children that a CUDA process forks without exec, such as PyTorch
# DataLoader workers with the default "fork" start method, inherit NVIDIA
# device mappings that CRIU cannot dump; the guard drops them in the child,
# so such jobs can be checkpointed without changes. It does not apply to
# statically linked programs.
# fork_guard = true

# How GPUs are found at start-up: "auto" uses NVML and falls back to the
# [[gpus]] list below when NVML is unavailable; "static" always uses the list.
# gpu_detection = "auto"

# Path (or name) of the NVML library. By default libnvidia-ml.so.1 and then
# libnvidia-ml.so are tried.
# nvml_library = "/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1"

# GPUs used when NVML is unavailable (or with gpu_detection = "static").
# [[gpus]]
# index = 0
# uuid = "GPU-..."
# name = "NVIDIA GeForce RTX 4090"
