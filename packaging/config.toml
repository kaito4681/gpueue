# Configuration of gpueue: read by the daemon (gpueue.service) and by the root
# helper (gpueue-helper.service). Keys marked [helper] are used by the helper,
# [both] by both, [cli] by the gpueue command; unmarked keys are the daemon's.
#
# Created by `gpueue service install`, the packages (.deb, .rpm, AUR) or the NixOS module; none
# of them overwrites an existing file.
# Every key is optional and unknown keys are ignored. A commented line
# `# key = value` shows the key's default. Lines indented below `# Example:`
# are examples, not defaults: keys that are unset by default, and the [[gpus]]
# list. Restart what uses a changed key:
# `sudo systemctl restart gpueue-helper.service gpueue.service`.
# (Restarting the helper leaves running jobs alone.)
#
# The helper runs as root and refuses to start unless this file and
# /etc/gpueue are owned by root and not group/world-writable. Flags on the
# helper's ExecStart= (see `gpueue-helper serve --help`) override this file.
# Groups and GPU slot limits are not configured here; they are stored in the
# daemon's database and changed with `gpueue group` and `gpueue gpu parallel`.
#
# Paths must be absolute; programs are a bare name (looked up in PATH) or an
# absolute path. Every *_secs key is at most one year (31536000).

# [both] Base directory of the state database (daemon/state.sqlite), the
# helper's state (helper/), job logs (logs/) and checkpoint images
# (checkpoints/). Keep the layout created by /etc/tmpfiles.d/gpueue.conf: the
# helper requires the base directory to be owned by root.
# data_dir = "/var/lib/gpueue"

# Override single locations below data_dir. helper_state_dir [helper],
# logs_dir and checkpoints_dir [both] must be owned by root.
# state_db = "/var/lib/gpueue/daemon/state.sqlite"
# helper_state_dir = "/var/lib/gpueue/helper"
# logs_dir = "/var/lib/gpueue/logs"
# checkpoints_dir = "/var/lib/gpueue/checkpoints"

# The socket clients connect to (callers are identified by SO_PEERCRED).
# api_socket = "/run/gpueue/gpueue.sock"

# [both] The root helper's socket.
# helper_socket = "/run/gpueue/helper.sock"

# [helper] The system user the daemon runs as (User= of gpueue.service); the
# helper accepts connections only from it.
# daemon_user = "gpueue"

# [both] Seconds between SIGTERM and SIGKILL when stopping a job.
# grace_secs = 30

# Command prefix a job's command line is appended to.
# shell = ["sh", "-c"]

# Warn when all checkpoint images together exceed this many bytes. Images are
# never deleted automatically: the owner of a job whose checkpoint crosses the
# limit is told once, administrators (root, gpueue-admin) on their commands
# while it is exceeded, and `gpueue doctor` reports it. Unset by default (no
# limit).
# Example:
#   checkpoint_size_limit_bytes = 500_000_000_000

# Remind each administrator of exceeded checkpoint_size_limit_bytes at most
# this often (seconds); going back under the limit resets the reminder.
# checkpoint_size_warning_interval_secs = 3600

# [both] Close TCP connections when checkpointing (`criu --tcp-close`).
# checkpoint_tcp_close = true

# [helper] Paths of criu, cuda-checkpoint and nvidia-smi (names are looked up
# in PATH; absolute paths must be owned by root).
# criu_path = "criu"
# cuda_checkpoint_path = "cuda-checkpoint"
# nvidia_smi_path = "nvidia-smi"

# [helper] "manual": the helper calls cuda-checkpoint around criu (works with
# the distribution's criu). "plugin": CRIU's CUDA plugin does it.
# cuda_checkpoint_mode = "manual"

# [helper] GPU isolation: every job unit gets DevicePolicy=closed and may open
# only the NVIDIA device nodes of the GPUs it was assigned (/dev/nvidia<minor>,
# /dev/nvidiactl, /dev/nvidia-uvm, /dev/nvidia-uvm-tools, /dev/nvidia-modeset);
# CPU jobs get none. false: no device restrictions, CUDA_VISIBLE_DEVICES alone
# selects the GPUs (needed for MIG, see docs/install.md).
# gpu_device_isolation = true

# [helper] Let jobs reach the system D-Bus. false (the default): /run/dbus is
# hidden behind an empty tmpfs in every job's mount namespace, also after a
# restore and also for a bus socket that appears later, so jobs cannot ask
# systemd or polkit for anything (systemctl, run0, pkexec, machinectl, ...),
# whatever polkit rules allow the owner's groups.
# job_system_dbus = false

# [helper] Let jobs reach systemd's Varlink services. false (the default):
# /run/systemd is hidden from jobs except journald's log sockets, resolved's
# resolution socket and resolv.conf files, and userdb/, so
# polkit-authorized Varlink methods (io.systemd.Manager reload/reexecute,
# io.systemd.Credentials decryption, mountfsd, nsresourced, machined, ...)
# are out of reach as well.
# job_systemd_varlink = false

# [helper] Deadline of a whole checkpoint (CUDA lock + checkpoint + criu dump)
# or restore (criu restore + CUDA restore + unlock) of one job, in seconds:
#   base + per_gib * GiB
# where GiB is the job's RSS + VRAM (rounded up) for a checkpoint and the image
# size for a restore. When it passes, the running tool (with all its child
# processes) is killed; a checkpoint is rolled back and the job keeps running,
# a restore is abandoned (the restored processes are killed, the image is
# kept). Measured on an NVMe disk: ~1.5-2.5 s per GiB end to end, so the
# default leaves a margin of more than 10x for slow disks and busy hosts (see
# docs/install.md).
# checkpoint_deadline_base_secs = 180
# checkpoint_deadline_secs_per_gib = 30

# [helper] Optional caps, in seconds, on `criu dump` / `criu restore` alone.
# Unset by default: only the deadline above applies.
# Example:
#   criu_dump_timeout_secs = 3600
#   criu_restore_timeout_secs = 3600

# [helper] Preload the fork guard (<data_dir>/lib/gpueue-forkguard-*.so) into
# jobs. Children that a CUDA process forks without exec, such as PyTorch
# DataLoader workers with the default "fork" start method, inherit NVIDIA
# device mappings that CRIU cannot dump; the guard drops them in the child,
# so such jobs can be checkpointed without changes. It does not apply to
# statically linked programs.
# fork_guard = true

# [helper] Who jobs may run as (checked for every spawn and restore; uid 0 is
# always refused). Jobs of users below job_min_uid are refused. Unset by
# default: UID_MIN of /etc/login.defs, or 1000 when it has none.
# Example:
#   job_min_uid = 1000

# [helper] Groups that give root-equivalent power. They are dropped from a
# job's supplementary groups (the helper's journal records it), and a job whose primary
# group is one of them is refused, as is restoring a checkpoint taken with
# one. Names are looked up in /etc/group; names not listed there are ignored;
# gid 0 is always dropped. Why each is listed: docker, lxd, incus-admin,
# libvirt and libvirtd (NixOS) start containers or VMs with host mounts or
# devices as root; disk
# gives raw access to block devices; sudo, wheel and admin give sudo rights
# (NOPASSWD rules or cached credentials would let an unattended job become
# root). Remove a group (e.g. docker) to let jobs use it again.
# job_denied_groups = ["docker", "lxd", "incus-admin", "libvirt", "libvirtd", "disk", "sudo", "wheel", "admin"]

# [helper] Directories of daemon sockets hidden from jobs behind an empty,
# root-owned tmpfs (like /run/dbus), also after a restore and also for a
# socket that appears later. Dropping a group from a job does not stop daemons
# that look the caller's groups up in the user database: libvirt authorizes
# through polkit, whose shipped rule trusts group libvirt (Fedora, RHEL,
# Debian, Arch, NixOS), and cupsd checks its SystemGroup (lpadmin, wheel) for
# callers on its socket (printing still works over localhost:631). Add the
# directory of any other such socket, e.g. "/nix/var/nix/daemon-socket" when
# nix-daemon's trusted-users lists a group or user besides root. Entries are
# absolute directories at least two levels deep; a missing one is created.
# `gpueue doctor` warns when a default is left out.
# job_hidden_socket_dirs = ["/run/libvirt", "/run/cups"]

# [helper] If not empty, only these users (by name) may run jobs; others are
# refused. Empty: every user with uid >= job_min_uid.
# job_allowed_users = []

# [cli] Where `gpueue update` and `gpueue doctor` look for releases:
# "github:<owner>/<repo>" (the GitHub releases of that repository).
# update_source = "github:kaito4681/gpueue"

# [cli] Whether `gpueue doctor` asks the release source for a newer version.
# update_check = true

# How GPUs are found at start-up: "auto" uses NVML and falls back to the
# [[gpus]] list below when NVML is unavailable; "static" always uses the list.
# gpu_detection = "auto"

# Path (or name) of the NVML library. Unset by default: libnvidia-ml.so.1 and
# then libnvidia-ml.so are tried.
# Example:
#   nvml_library = "/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1"

# GPUs used when NVML is unavailable (or with gpu_detection = "static"). Empty
# by default; `gpueue service install` appends an entry for each GPU that
# `nvidia-smi --query-gpu=index,uuid,name,memory.total --format=csv` lists.
# Keep the list in sync with the hardware (`gpueue doctor` compares the two).
# Fields of an entry:
# - index (required, unique): the GPU's index in PCI bus order, as nvidia-smi
#   numbers it. `gpueue add --gpu` takes it, and jobs see it in
#   CUDA_VISIBLE_DEVICES (with CUDA_DEVICE_ORDER=PCI_BUS_ID).
# - uuid (default ""): the GPU's UUID. The daemon warns at start-up when a GPU
#   with a different UUID than before is found at an index.
# - name (default ""): the model, shown by `gpueue gpu` and recorded with each
#   checkpoint; restoring requires the same model.
# - memory_total_bytes (unset by default): the GPU's memory in bytes, shown by
#   `gpueue gpu`.
# Example:
#   [[gpus]]
#   index = 0
#   uuid = "GPU-..."
#   name = "NVIDIA GeForce RTX 4090"
#   memory_total_bytes = 25_757_220_864

# Job priority: how queued jobs compete for group and GPU slots. The settings
# follow Slurm's priority/multifactor plugin; each key is the Slurm parameter
# in snake_case (PriorityWeightAge is priority_weight_age, ...), with
# durations in seconds. Keys below the [priority] line belong to the table
# (up to the next table, such as the [[gpus]] entries `gpueue service install`
# appends), so keep other keys above it. See "Priority and fair share" in
# docs/install.md.
#
# The priority of a pending job is
#     site factor
#   + priority_weight_age       * age factor
#   + priority_weight_fairshare * fair-share factor
#   + priority_weight_job_size  * job size factor
#   + priority_weight_partition * partition (group) factor
#   + priority_weight_tres      * TRES factors
#   - nice
#
# Every factor is between 0 and 1. pueue's `-o/--priority`, `gpueue top` and
# `switch` only order a user's own jobs. `gpueue prio` shows each pending job's
# factors, `gpueue share` the fair-share state.
# [priority]

# "multifactor", or "basic" for pueue's order (higher -o priority first, then
# submission order; nice, top and fair share are ignored). PriorityType.
# priority_type = "multifactor"

# Weights of the factors (PriorityWeight*). 0 disables a factor.
# priority_weight_age = 1000
# priority_weight_fairshare = 10000
# priority_weight_job_size = 0
# Groups play the role of Slurm partitions: a group's factor is its priority
# (`gpueue group priority <group> <n>`) over the highest group priority.
# priority_weight_partition = 0
# Per resource (CPU, GRES/gpu): weight × the job's share of the machine's
# total, e.g. "GRES/gpu=1000". Empty: no TRES factor. PriorityWeightTRES.
# priority_weight_tres = ""

# The age factor (time since the job became eligible: queued with every
# dependency done) reaches 1 after this many seconds. PriorityMaxAge.
# priority_max_age_secs = 604800

# Past usage counts half after this many seconds; 0 disables the decay.
# PriorityDecayHalfLife.
# priority_decay_half_life_secs = 604800

# How often usage is added up and decayed, in seconds. PriorityCalcPeriod.
# priority_calc_period_secs = 300

# Clear all usage: "none", "now" (whenever the daemon starts), "daily",
# "weekly" (Sunday), "monthly", "quarterly" or "yearly", at 00:00 local time.
# PriorityUsageResetPeriod.
# priority_usage_reset_period = "none"

# Give small jobs (fewer GPUs, or CPU-only) the larger job size factor.
# PriorityFavorSmall.
# priority_favor_small = false

# What one second of a running job counts as for fair share (TRESBillingWeights).
# Every job counts as one CPU, plus its GPUs.
# tres_billing_weights = "CPU=1.0,GRES/gpu=10.0"

# Users may move their own queued jobs to the top of their queue with
# `gpueue top` (Slurm's SchedulerParameters=enable_user_top); administrators
# always may. It also decides what a user's `start <id>`, `add -i`,
# `restart -i` and `restore -i` do: with true the job is queued first among
# the user's jobs, with false it is just queued (only administrators start
# jobs right away).
# enable_user_top = true
