[package]
name = "puzuz-core"
description = "Core domain model and scheduling logic for puzuz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
# SQLite-backed persistence, used by the daemon. Off by default so the root
# helper (through puzuz-protocol) does not link SQLite.
storage = ["dep:rusqlite"]

[dev-dependencies]
tempfile.workspace = true
# Counts the queries scheduling runs (storage tests).
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
