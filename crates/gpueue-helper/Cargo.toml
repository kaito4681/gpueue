[package]
name = "gpueue-helper"
description = "Privileged helper that runs, signals and checkpoints gpueue jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpueue-helper"
path = "src/main.rs"

[dependencies]
gpueue-protocol.workspace = true
gpueue-checkpoint.workspace = true
gpueue-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
zbus.workspace = true
nix.workspace = true
rustix = { workspace = true, features = ["thread", "process", "mount", "fs", "net"] }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
