[package]
name = "puzuz"
description = "GPU-aware job queue with transparent checkpointing (CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "puzuz"
path = "src/main.rs"

[dependencies]
puzuz-core.workspace = true
puzuz-protocol = { workspace = true, features = ["client"] }
puzuz-daemon.workspace = true
puzuz-checkpoint.workspace = true
puzuz-config.workspace = true
clap = { workspace = true, features = ["env", "wrap_help"] }
clap_complete.workspace = true
clap_complete_nushell.workspace = true
chrono.workspace = true
interim.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
serde.workspace = true
serde_json.workspace = true
comfy-table.workspace = true
nix = { workspace = true, features = ["dir"] }
ureq.workspace = true
minisign-verify.workspace = true
sha2.workspace = true
semver.workspace = true
toml = { workspace = true, features = ["display"] }
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true

[lints]
workspace = true
