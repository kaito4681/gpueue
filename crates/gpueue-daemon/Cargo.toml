[package]
name = "gpueue-daemon"
description = "The gpueue daemon: API, scheduler and state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Testing only: lets the integration tests impersonate uids with a header.
# Never enable it in a shipped build.
test-uid-header = []

[dependencies]
gpueue-core = { workspace = true, features = ["storage"] }
gpueue-protocol.workspace = true
gpueue-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "fs",
    "sync",
    "time",
    "signal",
] }
axum.workspace = true
futures.workspace = true
tokio-util.workspace = true
nix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nvml-wrapper.workspace = true
# The API server (see `server.rs`): HTTP/1 with header and idle timeouts.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tower-service.workspace = true
# The local time zone, for priority_usage_reset_period.
chrono.workspace = true

[dev-dependencies]
# Paused time in the unit tests (`start_paused`).
tokio = { workspace = true, features = ["test-util"] }
# Enables the test-only feature for this crate's own tests.
gpueue-daemon = { path = ".", features = ["test-uid-header"] }
tempfile.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true

[lints]
workspace = true
