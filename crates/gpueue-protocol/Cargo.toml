[package]
name = "gpueue-protocol"
description = "Wire types shared by the gpueue CLI, daemon and helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The async HTTP-over-Unix-socket client used by the CLI. The helper depends
# on this crate without it, so it only pulls in the plain wire types.
client = [
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:thiserror",
]

[dependencies]
gpueue-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "net"] }
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
http-body-util = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "sync", "time"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
tempfile.workspace = true

[[test]]
name = "client"
required-features = ["client"]

[lints]
workspace = true
