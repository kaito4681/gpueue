[package]
name = "puzuz-protocol"
description = "Wire types shared by the puzuz CLI, daemon and helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Reserved for the HTTP-over-Unix-socket client used by the CLI (hyper,
# hyper-util, ...). The helper depends on this crate without it, so it only
# pulls in the plain wire types.
client = []

[dependencies]
puzuz-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
